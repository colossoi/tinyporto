[package]
name = "tinyporto-driver"
version = "0.1.0"
edition = "2021"
description = "Window and input shell for the Wyn-generated Rust/WGPU application."

[[bin]]
name = "tinyporto"
path = "src/main.rs"

[dependencies]
# `spirv` enables ShaderSource::SpirV (naga-validated SPIR-V ingest, cross-backend).
wgpu = { version = "27", features = ["spirv"] }
winit = "0.30"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Decode material source maps and encode offscreen screenshots.
png = "0.17"
